# Legacy fallback when the service Root Directory is the repository root (/).
# The staging backend uses /backend/railway.toml instead.
[build]
builder = "NIXPACKS"

[deploy]
# The cd is intentional only for this repository-root fallback configuration.
preDeployCommand = ["cd backend && alembic upgrade head"]
startCommand = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/ready"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
